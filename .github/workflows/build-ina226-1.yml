name: Build Tasmota INA226

on:
  workflow_dispatch:
  push:
    paths:
      - 'tasmota/user_config_override.h'
      - '.github/workflows/build-ina226.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Tasmota
        run: pio run -e tasmota

      - name: Prepare firmware
        run: |
          mkdir -p firmware
          cp .pio/build/tasmota/firmware.bin firmware/tasmota-INA226.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-INA226
          path: firmware/tasmota-INA226.bin
